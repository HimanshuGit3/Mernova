# API + MongoDB for a self-contained run (D10: prepared, not deployed).
#   JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('hex'))") docker compose up --build
# Then build the web app with VITE_API_URL pointing at this API (see docs/DEPLOY.md).
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/fixit
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 random characters)}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      AI_TRIAGE_ENABLED: ${AI_TRIAGE_ENABLED:-true}
      DUPLICATE_SIMILARITY: "0.88"
      CAMPUS_CENTER_LAT: "13.1718"
      CAMPUS_CENTER_LNG: "77.5362"
      # Optional push: mount the key and set FIREBASE_SERVICE_ACCOUNT=/run/secrets/firebase.json
    volumes:
      - uploads:/app/server/uploads
      - models:/app/server/.cache/models

volumes:
  mongo-data:
  uploads:
  models:
