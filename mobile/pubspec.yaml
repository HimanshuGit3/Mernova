name: fixit_campus
description: "FixIt Campus: Spot it. Snap it. Sorted. Campus issue reporting app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  geolocator: ^14.1.1
  flutter_image_compress: ^2.5.1
  cached_network_image: ^4.0.4
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  uuid: ^4.6.0
  socket_io_client: ^3.1.6
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#0F1F3D'
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: '#0F1F3D'
  image: assets/icon/splash.png
  android_12:
    color: '#0F1F3D'
    image: assets/icon/splash.png
  ios: false
  web: false
