name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
  CLIENT_ORIGIN: http://localhost:5173
  MONGODB_URI: mongodb://127.0.0.1:27017/fixit
  MONGODB_URI_TEST: mongodb://127.0.0.1:27017/fixit_test
  SEED_PASSWORD: FixIt@2026

jobs:
  server:
    name: Server tests + e2e
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint -w server
      - run: npm test -w server
      - run: npm run e2e

  client:
    name: Web lint, build and UI tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint -w client
      - run: npm run build -w client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:ui -w client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/test-results

  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # Generates the Gradle wrapper and other platform files without overwriting committed ones
      - run: flutter create --org com.fixitcampus --project-name fixit_campus --platforms android .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
